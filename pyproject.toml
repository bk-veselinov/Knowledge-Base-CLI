[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-base-cli"
version = "0.1.0"
description = "Command-line knowledge base"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-mock>=3.17", "ruff>=0.6"]

[project.scripts]
knowledge = "knowledge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"